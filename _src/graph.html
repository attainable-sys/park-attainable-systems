      if (!strong && placed.some(q => tx < q[0] + q[2] && tx + bw > q[0] && by < q[1] + 14 && by + 14 > q[1])) continue; placed.push([tx, by, bw]);

    ctx.globalAlpha = 1; requestAnimationFrame(draw);
  }
  function pick(x, y) { let best = null, bd = 1e9; for (const n of N) { if (!vis(n)) continue; const d = Math.hypot(n.sx - x, n.sy - y) - n.r * n.ss; if (d < 9 && d + n.sz * .01 < bd) { bd = d + n.sz * .01; best = n; } } return best; }

  // ---- panel + legend
  const panel = document.getElementById('panel'), esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function show(n) { sel = n; if (!n) { panel.hidden = true; return; }
    const ns = n.nbr.slice().sort((a, b) => b.deg - a.deg);
    panel.style.setProperty('--k', 'var(--c' + n.g + ')'); panel.style.animation = 'none'; void panel.offsetWidth; panel.style.animation = '';
    panel.innerHTML = '<button class="x" type="button" aria-label="close">×</button><div class="id">' + n.id + '</div><h2>' + esc(n.t) + '</h2><div class="meta">' + esc(F[n.f].l) + ' · ' + (n.nb ? 'writing' : 'vault note') + ' · ' + n.deg + (n.deg === 1 ? ' link' : ' links') + '</div><a href="' + SITE + n.href + '">open the note →</a>' +
      (ns.length ? '<h3>connected to</h3><ul>' + ns.map(m => '<li><button type="button" data-i="' + m.i + '"><i style="background:var(--c' + m.g + ')"></i><span>' + esc(m.t) + '</span></button></li>').join('') + '</ul>' : '');
    panel.hidden = false; panel.scrollTop = 0; }
  panel.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.classList.contains('x')) show(null); else show(N[+b.dataset.i]); });
  const legend = document.getElementById('legend'), gname = k => k < 7 ? F[order[k]].l : 'everything else', gcount = k => N.filter(n => n.g === k).length;
  legend.innerHTML = [0, 1, 2, 3, 4, 5, 6, 7].map(k => '<button type="button" class="on" data-g="' + k + '" aria-pressed="true" style="--k:var(--c' + k + ')"><i></i><span>' + esc(gname(k)) + ' <span class="n">' + gcount(k) + '</span></span></button>').join('');
  legend.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const g = +b.dataset.g;
    hidden.has(g) ? hidden.delete(g) : hidden.add(g); b.classList.toggle('on', !hidden.has(g)); b.classList.toggle('off', hidden.has(g)); b.setAttribute('aria-pressed', !hidden.has(g)); });

  // ---- input
  let drag = false, moved = 0, pts = new Map(), pinch = 0;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); drag = true; moved = 0; cv.classList.add('drag');
    if (pts.size === 2) { const p = [...pts.values()]; pinch = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]); } });
  cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(), p = pts.get(e.pointerId);
    if (!p) { hover = pick(e.clientX - r.left, e.clientY - r.top); cv.classList.toggle('over', !!hover); return; }
    if (pts.size === 2) { pts.set(e.pointerId, [e.clientX, e.clientY]); const q = [...pts.values()], d = Math.hypot(q[0][0] - q[1][0], q[0][1] - q[1][1]); if (pinch) zoom = Math.max(.4, Math.min(4, zoom * d / pinch)); pinch = d; moved = 99; return; }
    const dx = e.clientX - p[0], dy = e.clientY - p[1]; moved += Math.abs(dx) + Math.abs(dy); yaw += dx * .005; pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * .005)); pts.set(e.pointerId, [e.clientX, e.clientY]); });
  const up = e => { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); pinch = 0; if (!pts.size) { drag = false; cv.classList.remove('drag');
    if (moved < 6 && e.type === 'pointerup') { const r = cv.getBoundingClientRect(); show(pick(e.clientX - r.left, e.clientY - r.top)); } } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('pointerleave', () => { if (!drag) hover = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(.4, Math.min(4, zoom * Math.exp(-e.deltaY * .0012))); }, { passive: false });
  const ob = document.getElementById('orbit'); const lab = () => ob.textContent = auto ? 'pause' : 'orbit'; lab();
  ob.addEventListener('click', () => { auto = !auto; lab(); });
  document.getElementById('reset').addEventListener('click', () => { yaw = 2.1; pitch = -.18; zoom = 1; show(null); document.getElementById('q').value = ''; query = ''; });
  document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); });
  document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter' && query) { const m = N.filter(n => vis(n) && n.t.toLowerCase().includes(query)).sort((a, b) => b.deg - a.deg)[0]; if (m) show(m); } });
  addEventListener('keydown', e => { if (e.key === 'Escape') show(null); });
  addEventListener('resize', resize); new MutationObserver(colors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  colors(); resize(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {}); requestAnimationFrame(draw);
})();
</script>
